<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pago de seña (demo) | Chivas Barbería</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Roboto+Slab:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
</head>
<body>
  <main class="simple-page">
    <section class="card">
      <p class="eyebrow">Chivas Barbería</p>
      <h1>Pago de seña</h1>
      <p class="demo-banner">Modo demo: este pago es simulado. Configurá <code>MP_ACCESS_TOKEN</code> para cobrar con Mercado Pago.</p>
      <div class="summary" id="summary"></div>
      <p class="form-error" id="error" role="alert" hidden></p>
      <div class="actions">
        <a class="btn btn-ghost" href="/">Cancelar</a>
        <button class="btn btn-primary" id="pay" type="button">Simular pago</button>
      </div>
    </section>
  </main>
  <script src="/js/pago-demo.js" type="module"></script>
</body>
</html>
